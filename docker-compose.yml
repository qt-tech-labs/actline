services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: actline
      POSTGRES_PASSWORD: actline
      POSTGRES_DB: actline
    ports:
      - "5432:5432"
    volumes:
      - actline-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actline"]
      interval: 5s
      retries: 10

volumes:
  actline-pg:
